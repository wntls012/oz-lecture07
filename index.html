<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BOSS TIMER - 혈맹 대시보드</title>
  <style>
    :root {
      --bg: #0f1117;
      --card-bg: #1a1d26;
      --accent: #6366f1;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text: #f3f4f6;
      --text-sub: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 70px; -webkit-tap-highlight-color: transparent; }
    
    /* 상단 헤더 */
    header {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #151821;
      border-bottom: 1px solid #282d3d;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .guild-badge { font-size: 13px; background: #2e354b; color: #a5b4fc; padding: 4px 8px; border-radius: 6px; font-weight: 600; }
    
    /* 웹 푸시 권한 배너 */
    .push-banner {
      margin: 12px 16px;
      padding: 12px 14px;
      background: linear-gradient(135deg, #1e1b4b, #2e1065);
      border: 1px solid #4338ca;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .push-banner p { font-size: 12px; color: #c7d2fe; }
    .push-banner button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    /* 보스 카드 리스트 */
    .boss-list { padding: 0 16px; display: flex; flex-direction: column; gap: 10px; }
    .boss-card {
      background: var(--card-bg);
      border: 1px solid #262b3a;
      border-radius: 12px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: border-color 0.2s;
    }
    .boss-card.imminent { border-color: var(--danger); background: #1f1418; }
    
    .boss-meta h3 { font-size: 15px; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
    .boss-meta .location { font-size: 12px; color: var(--text-sub); }
    .boss-meta .cycle-tag { font-size: 11px; background: #282d3d; color: #d1d5db; padding: 2px 5px; border-radius: 4px; }

    .timer-wrap { text-align: right; }
    .time-left { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .time-left.imminent { color: var(--danger); }
    .next-spawn { font-size: 11px; color: var(--text-sub); margin-top: 2px; }

    /* 빠른 컷/멍 버튼 */
    .action-group { display: flex; gap: 6px; margin-top: 8px; }
    .btn-action {
      background: #2b3042;
      border: none;
      color: #e5e7eb;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-cut { background: #3730a3; color: #e0e7ff; }

    /* 하단 탭 내비게이션 */
    nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      height: 56px;
      background: #151821;
      border-top: 1px solid #282d3d;
      display: flex;
      justify-content: space-around;
      align-items: center;
      font-size: 11px;
      color: var(--text-sub);
    }
    .nav-item.active { color: var(--accent); font-weight: 700; }
  </style>
</head>
<body>

  <header>
    <div>
      <h1 style="font-size: 16px;">BOSS RADAR</h1>
      <span style="font-size: 11px; color: #10b981;">● 디스코드 동기화 중</span>
    </div>
    <span class="guild-badge">1서버 붉은기사단</span>
  </header>

  <!-- 홈 화면 추가 및 푸시 활성화 배너 -->
  <div class="push-banner">
    <div>
      <strong>젠 3분 전 알림 받기</strong>
      <p>화면이 꺼져 있어도 진동 푸시가 울립니다</p>
    </div>
    <button onclick="requestPush()">알림 켜기</button>
  </div>

  <!-- 보스 타임 카드 목록 -->
  <main class="boss-list">
    <!-- 임박한 보스 -->
    <div class="boss-card imminent">
      <div class="boss-meta">
        <h3>거대 드레이크 <span class="cycle-tag">6시간 젠</span></h3>
        <span class="location">용의 계곡 동쪽 3구역</span>
        <div class="action-group">
          <button class="btn-action btn-cut" onclick="triggerCut('거대 드레이크')">방금 컷</button>
          <button class="btn-action" onclick="alert('멍 처리되었습니다. 다음 젠으로 넘어갑니다.')">멍(미등장)</button>
        </div>
      </div>
      <div class="timer-wrap">
        <div class="time-left imminent">02:41 남음</div>
        <div class="next-spawn">예상: 17:45:00</div>
      </div>
    </div>

    <!-- 다음 보스 -->
    <div class="boss-card">
      <div class="boss-meta">
        <h3>피닉스 <span class="cycle-tag">8시간 젠</span></h3>
        <span class="location">화룡의 둥지 정상</span>
        <div class="action-group">
          <button class="btn-action btn-cut" onclick="triggerCut('피닉스')">방금 컷</button>
          <button class="btn-action">멍</button>
        </div>
      </div>
      <div class="timer-wrap">
        <div class="time-left">34:10 남음</div>
        <div class="next-spawn">예상: 18:16:30</div>
      </div>
    </div>

    <!-- 여유 있는 보스 -->
    <div class="boss-card">
      <div class="boss-meta">
        <h3>바포메트 <span class="cycle-tag">3시간 젠</span></h3>
        <span class="location">글루디오 던전 7층</span>
        <div class="action-group">
          <button class="btn-action btn-cut" onclick="triggerCut('바포메트')">방금 컷</button>
          <button class="btn-action">멍</button>
        </div>
      </div>
      <div class="timer-wrap">
        <div class="time-left">01:52:19 남음</div>
        <div class="next-spawn">예상: 19:35:00</div>
      </div>
    </div>
  </main>

  <nav>
    <div class="nav-item active">보스타임</div>
    <div class="nav-item" onclick="alert('경매/분배금 장부 화면으로 이동')">정산장부</div>
    <div class="nav-item" onclick="alert('공대원 참여도 통계 화면으로 이동')">참여도</div>
    <div class="nav-item" onclick="alert('디스코드 웹훅 및 젠 시간 설정')">설정</div>
  </nav>

  <script>
    function requestPush() {
      if ('Notification' in window) {
        Notification.requestPermission().then(permission => {
          if (permission === 'granted') {
            alert('웹 푸시 알림이 활성화되었습니다! 보스 젠 3분 전에 모바일 팝업이 울립니다.');
          } else {
            alert('알림 권한이 거부되었습니다. 브라우저 설정에서 허용해주세요.');
          }
        });
      } else {
        alert('이 브라우저는 웹 푸시를 지원하지 않습니다.');
      }
    }

    function triggerCut(bossName) {
      alert(`[${bossName}] 컷 타임이 기록되었습니다.\n디스코드 채널 및 연동된 모든 길드원의 화면에 실시간 반영됩니다.`);
    }
  </script>
</body>
</html>
